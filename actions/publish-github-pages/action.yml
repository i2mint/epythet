name: "publish github pages"

description: "Generate Epythet documentation and push to github pages branch"

inputs:
  ignore:
    description: "skip file in documentation generation, if path contains any ignore strings"
    required: false

  github-token:
    description: GITHUB_TOKEN
    required: true

  docs-branch:
    description: "Branch to push documentation build"
    required: false
    default: "gh-pages"

  docs-dir:
    description: "Location of generated docs"
    required: false
    default: "./docsrc/_build/html/"

  python-version:
    description: "Python version used to generate documentation. Override
      via `with: python-version: '3.13'` if your project's `requires-python`
      is higher than this default."
    required: false
    default: "3.12"

  epythet-spec:
    description: "pip requirement spec for the epythet version that builds the
      docs. The default is epythet v2 (README landing page, nested API tree,
      agent outputs); pass `epythet-spec: \"epythet<0.2\"` to keep a repo on the
      0.1.x layout (see i2mint/epythet#16)."
    required: false
    # The fleet default is epythet v2 (0.2.x) since the WP5 flip (see #16). A repo that
    # must stay on 0.1.x passes `epythet-spec: "epythet<0.2"` explicitly.
    default: "epythet>=0.2,<0.3"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build from the branch tip
      # The wads CI publishes to PyPI, then pushes a version-bump commit marked
      # [skip ci] before this job runs, so the event SHA is the commit *before*
      # the bump. Fast-forward to the tip so the site is built from the
      # released version, with its tag, and epythet's provenance footer can
      # compare it with PyPI. Never fails the job: on any problem the event
      # commit is built as before.
      run: |
        if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
          if git fetch --quiet origin "${{ github.ref_name }}" && git merge --ff-only --quiet FETCH_HEAD; then
            echo "Building $(git rev-parse --short HEAD) (tip of ${{ github.ref_name }}; event commit ${GITHUB_SHA::7})"
          else
            echo "::notice::Could not fast-forward to origin/${{ github.ref_name }}; building the event commit ${GITHUB_SHA::7}"
          fi
        fi
      shell: bash

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Epythet
      run: |
        python -m pip install --upgrade pip
        # The spec defaults to the fleet-wide pin declared on the `epythet-spec` input.
        pip -q install "${{ inputs.epythet-spec }}"
      shell: bash

    - name: Install Repo Project
      run: pip install -e .
      shell: bash

    - name: Generate Documentation
      run: epythet quickstart . --ignore ${{ inputs.ignore }}
      shell: bash

    - name: Deploy GitHub Pages
      uses: peaceiris/actions-gh-pages@v3.9.1
      with:
        github_token: ${{ inputs.github-token }}
        publish_branch: ${{ inputs.docs-branch }}
        publish_dir: ${{ inputs.docs-dir }}
        # epythet's Sphinx config includes sphinx.ext.githubpages, which writes a
        # .nojekyll into the build; keeping Jekyll off here is the same decision
        # stated twice (Jekyll would drop the _static/ and _autosummary/ trees).
        enable_jekyll: false
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: Enable GitHub Pages source
      run: |
        # Enable Pages if not already configured, or update if misconfigured.
        # This is idempotent -- safe to run on every CI invocation.
        REPO="${{ github.repository }}"
        BRANCH="${{ inputs.docs-branch }}"
        # Try to create (POST). If Pages already exists, API returns 409 -- then update (PUT).
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST \
          -H "Authorization: token ${{ inputs.github-token }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${REPO}/pages" \
          -d "{\"build_type\":\"legacy\",\"source\":{\"branch\":\"${BRANCH}\",\"path\":\"/\"}}")
        if [ "$STATUS" = "409" ] || [ "$STATUS" = "422" ]; then
          # Already exists -- update source to ensure correct config
          curl -s -o /dev/null \
            -X PUT \
            -H "Authorization: token ${{ inputs.github-token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d "{\"source\":{\"branch\":\"${BRANCH}\",\"path\":\"/\"}}"
        fi
        echo "GitHub Pages source set to ${BRANCH} / (root)"
      shell: bash
