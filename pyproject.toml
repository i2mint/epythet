[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epythet"
version = "0.2.0"
description = "Beautiful, correct documentation from a Python package, with no boilerplate: Sphinx, README landing page, nested API tree, themes, docstring normalizer, agent-facing outputs, GitHub Pages"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["documentation", "sphinx", "github-pages", "llms.txt", "publishing"]
authors = [{ email = "andie.phan@analog.com" }]
dependencies = [
    "sphinx>=9,<10",
    "myst-parser>=5.1,<6",
    "sphinx-autoapi>=3.8,<4",
    "sphinx-autodoc-typehints>=3",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-mermaid>=1",
    "sphinx-llm>=1,<2",
    "sphinx-markdown-builder>=0.6",
    "furo>=2024",
    "shibuya>=2025",
    "pydata-sphinx-theme>=0.16",
    "sphinxawesome-theme>=5",
    "cw>=0.1.1,<0.2",
    "dol",
    "requests",
]

[project.license]
text = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/i2mint/epythet"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "hubcap", "pandas", "ruff>=0.1.0"]
docs = []
themes = ["sphinx-book-theme>=1.1", "sphinx-rtd-theme>=3"]
pdf = ["playwright>=1.40"]
validate = ["pyyaml>=6.0", "ruff>=0.5", "pydoclint>=0.5"]

[project.scripts]
epythet = "epythet.cli:epythet_cli"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.epythet]
# epythet/ledger holds rule fixtures (.py files that are not modules to document)
ignore = ["tests/", "scrap/", "examples/", "ledger/"]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = ["3.11", "3.12"]
pytest_args = ["-v", "--tb=short"]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = ["term", "xml"]
exclude_paths = ["examples", "scrap"]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.11"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = ["tests/", "scrap/", "examples/"]
